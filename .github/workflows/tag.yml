name: tag

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native toolchain dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y blueprint-compiler libglib2.0-dev-bin clang

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test

      - name: Publish (linux-x64, AOT)
        run: >
          dotnet publish src/SilverScreen.App/SilverScreen.App.csproj
          -c Release -r linux-x64 --self-contained
          -o publish/linux-x64

      - name: Stage tarball and checksums
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dist="silverscreen-${ver}-linux-x64"
          mkdir -p "${dist}/bin"
          mkdir -p "${dist}/share/applications"
          mkdir -p "${dist}/share/metainfo"
          mkdir -p "${dist}/share/icons/hicolor/scalable/apps"
          mkdir -p "${dist}/share/licenses/silverscreen"
          mkdir -p "${dist}/share/doc/silverscreen"

          cp publish/linux-x64/SilverScreen "${dist}/bin/"
          cp packaging/io.github.silverscreen.SilverScreen.desktop "${dist}/share/applications/"
          cp packaging/io.github.silverscreen.SilverScreen.metainfo.xml "${dist}/share/metainfo/"
          cp packaging/io.github.silverscreen.SilverScreen.svg "${dist}/share/icons/hicolor/scalable/apps/" 2>/dev/null || \
            cp src/SilverScreen.App/Assets/silverscreen.svg "${dist}/share/icons/hicolor/scalable/apps/io.github.silverscreen.SilverScreen.svg"
          cp LICENSE "${dist}/share/licenses/silverscreen/"
          cp THIRD-PARTY.md "${dist}/share/doc/silverscreen/"

          cp packaging/install.sh "${dist}/"
          chmod +x "${dist}/install.sh"
          cp LICENSE THIRD-PARTY.md "${dist}/"

          tar -czf "${dist}.tar.gz" "${dist}"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dist="silverscreen-${ver}-linux-x64"
          gh release create "${GITHUB_REF_NAME}" \
            --title "SilverScreen ${ver}" \
            --notes "SilverScreen ${ver}. See THIRD-PARTY.md for attribution." \
            "${dist}.tar.gz" "${dist}.tar.gz.sha256"
