name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Linux x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            dotnet-sdk \
            clang \
            pkgconf \
            glib2 \
            blueprint-compiler \
            gtk4 \
            libadwaita \
            webkitgtk-6.0 \
            libsoup3 \
            zstd \
            curl \
            librsvg \
            openssh
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Publish Native AOT
        run: |
          dotnet publish src/SilverScreen.App/SilverScreen.App.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o ./publish
          objcopy --remove-section .note.gnu.property ./publish/SilverScreen 2>/dev/null || true

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p ./archive
          cp ./publish/SilverScreen ./archive/
          cp packaging/io.github.silverscreen.SilverScreen.desktop ./archive/
          cp packaging/io.github.silverscreen.SilverScreen.metainfo.xml ./archive/
          cp packaging/io.github.silverscreen.SilverScreen.svg ./archive/
          cp LICENSE ./archive/
          cp lib/Hi3Helper.SharpDiscordRPC/LICENSE ./archive/DiscordRPC.LICENSE
          cp lib/YoutubeAPI/LICENSE ./archive/YoutubeAPI.LICENSE
          tar --zstd -cf "silverscreen-v${VERSION}-x86_64.tar.zst" -C ./archive .

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          packaging/build-appimage.sh ./AppDir ./SilverScreen-x86_64.AppImage ./publish

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SilverScreen-x86_64.AppImage
            silverscreen-v*-x86_64.tar.zst

      - name: Update AUR silverscreen-bin package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning ::AUR_SSH_PRIVATE_KEY secret is not configured; skipping AUR publication."
            exit 0
          fi

          VERSION="${GITHUB_REF#refs/tags/v}"
          ARCHIVE="silverscreen-v${VERSION}-x86_64.tar.zst"
          SHA256=$(sha256sum "${ARCHIVE}" | awk '{print $1}')

          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          eval $(ssh-agent -s)
          ssh-add - <<< "${AUR_SSH_PRIVATE_KEY}"

          git clone ssh://aur@aur.archlinux.org/silverscreen-bin.git aur-repo

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur-repo/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur-repo/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" aur-repo/PKGBUILD

          useradd -m builder || true
          chown -R builder:builder aur-repo
          su builder -c "cd aur-repo && makepkg --printsrcinfo" > aur-repo/.SRCINFO

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit for AUR."
          else
            git commit -m "chore(release): update to v${VERSION}"
            git branch -M master
            git push origin master
          fi
